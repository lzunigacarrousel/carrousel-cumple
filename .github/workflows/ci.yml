name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP 8.2 / MariaDB / HTTP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          # Disposable CI service only; these values are not production secrets.
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: carrousel_cumple_test
          MARIADB_USER: carrousel_cumple_test
          MARIADB_PASSWORD: ci-test-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CUMPLE_TEST_DB_HOST: 127.0.0.1
      CUMPLE_TEST_DB_PORT: ${{ job.services.mariadb.ports[3306] }}
      CUMPLE_TEST_DB_NAME: carrousel_cumple_test
      CUMPLE_TEST_DB_USER: carrousel_cumple_test
      CUMPLE_TEST_DB_PASS: ci-test-only
      TZ: America/Guatemala
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: PHP y Composer
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, openssl
          coverage: none
          tools: composer:v2
      - name: Node para comprobar JavaScript
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validar e instalar dependencias fijadas
        run: |
          composer validate --strict
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Sintaxis y pruebas aisladas
        shell: pwsh
        run: ./tools/check.ps1 -Integration
